[project]
name = "db"
version = "0.1.1"
description = "Utilidades personales para ejecutar SQL en Oracle y SQL Server"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "oracledb==3.4.1",
    "pymssql==2.3.10",
    "sqlalchemy==2.0.45",
]

[dependency-groups]
dev = [
    "ipykernel==7.1.0",
]

[build-system]
requires = ["hatchling>=1.24.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["db"]
